apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: book-review
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        # The frontend is built with NEXT_PUBLIC_API_URL=/api and its code appends /api,
        # so the browser calls /api/api/... Both forms go to the backend's real /api routes.
        location /api/api/ {
            proxy_pass http://backend-service.book-review.svc.cluster.local:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend-service.book-review.svc.cluster.local:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="bold" fill="#111827">Book Review App on AKS: three-tier architecture</text>
  <text x="40" y="72" font-size="15" fill="#4b5563">Victor Durojaiye · DMI Week 12 Assignment 10 · cluster aks-dmi-wk12 (Sweden Central, Kubernetes 1.36.4, Azure CNI overlay + Cilium, 1 × Standard_B2ms)</text>

  <!-- Internet -->
  <rect x="40" y="110" width="220" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="150" y="145" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">User browser</text>
  <text x="150" y="170" font-size="13" text-anchor="middle" fill="#374151">http://&lt;public IP&gt;/  ·  /api/...</text>

  <rect x="330" y="110" width="300" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480" y="143" font-size="17" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Azure Standard Load Balancer</text>
  <text x="480" y="168" font-size="13" text-anchor="middle" fill="#1e3a8a">public IP · TCP 80 only</text>
  <line x1="260" y1="150" x2="326" y2="150" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Cluster / namespace -->
  <rect x="30" y="220" width="1440" height="610" rx="14" fill="#fafafa" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="50" y="248" font-size="15" font-weight="bold" fill="#374151">AKS cluster aks-dmi-wk12  ·  namespace: book-review</text>

  <!-- Frontend tier -->
  <rect x="60" y="270" width="440" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="280" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Service frontend-service · LoadBalancer · 80 → 80</text>
  <line x1="480" y1="190" x2="300" y2="268" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="60" y="330" width="440" height="300" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="356" font-size="15" font-weight="bold" fill="#1e3a8a">Deployment frontend · 2 replicas</text>
  <text x="80" y="378" font-size="13" fill="#1e3a8a">labels app=frontend, tier=frontend</text>
  <rect x="80" y="392" width="400" height="104" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="96" y="416" font-size="14" font-weight="bold" fill="#111827">container nginx · nginx:1.27-alpine · :80</text>
  <text x="96" y="438" font-size="13" fill="#374151">location /         → 127.0.0.1:3000</text>
  <text x="96" y="458" font-size="13" fill="#374151">location /api/     → backend-service:3001/api/</text>
  <text x="96" y="478" font-size="13" fill="#374151">location /api/api/ → backend-service:3001/api/</text>
  <rect x="80" y="506" width="400" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="96" y="530" font-size="14" font-weight="bold" fill="#111827">container frontend · Next.js · :3000 (non-root)</text>
  <text x="96" y="552" font-size="12" fill="#374151">kingjaiye/book-review-frontend@sha256:92a9e860…</text>
  <text x="80" y="596" font-size="12" fill="#374151">ConfigMap nginx-config → /etc/nginx/conf.d/default.conf</text>
  <text x="80" y="616" font-size="12" fill="#374151">built with NEXT_PUBLIC_API_URL=/api (same origin)</text>

  <!-- Backend tier -->
  <rect x="560" y="270" width="420" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="770" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">Service backend-service · ClusterIP · 3001</text>
  <line x1="500" y1="448" x2="556" y2="296" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="508" y="380" font-size="12" fill="#15803d" transform="rotate(-70 508 380)">/api → :3001</text>

  <rect x="560" y="330" width="420" height="300" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="580" y="356" font-size="15" font-weight="bold" fill="#14532d">Deployment backend · 2 replicas</text>
  <text x="580" y="378" font-size="13" fill="#14532d">labels app=backend, tier=backend</text>
  <rect x="580" y="392" width="380" height="74" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="596" y="416" font-size="14" font-weight="bold" fill="#111827">container backend · Node.js/Express · :3001</text>
  <text x="596" y="438" font-size="12" fill="#374151">kingjaiye/book-review-backend@sha256:0eb39b28…</text>
  <text x="596" y="456" font-size="12" fill="#374151">non-root · probes on / (registered after DB sync)</text>
  <text x="580" y="492" font-size="13" fill="#374151">envFrom ConfigMap backend-config:</text>
  <text x="596" y="512" font-size="12" fill="#374151">PORT=3001, DB_HOST=mysql, DB_PORT=3306,</text>
  <text x="596" y="530" font-size="12" fill="#374151">DB_NAME=book_review_db, ALLOWED_ORIGINS</text>
  <text x="580" y="558" font-size="13" fill="#374151">Secret book-review-secret (keys only):</text>
  <text x="596" y="578" font-size="12" fill="#374151">DB_USER, DB_PASS, JWT_SECRET</text>
  <text x="580" y="610" font-size="12" fill="#374151">TLS to MySQL (Sequelize ssl.require)</text>

  <!-- Data tier -->
  <rect x="1040" y="270" width="400" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="1240" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#78350f">Service mysql · headless (None) · 3306</text>
  <line x1="980" y1="448" x2="1036" y2="296" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="986" y="384" font-size="12" fill="#b45309" transform="rotate(-70 986 384)">mysql:3306</text>

  <rect x="1040" y="330" width="400" height="300" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1060" y="356" font-size="15" font-weight="bold" fill="#78350f">StatefulSet mysql · 1 replica (mysql-0)</text>
  <text x="1060" y="378" font-size="13" fill="#78350f">label app=mysql</text>
  <rect x="1060" y="392" width="360" height="74" rx="8" fill="#ffffff" stroke="#b45309"/>
  <text x="1076" y="416" font-size="14" font-weight="bold" fill="#111827">container mysql · mysql:8.4 · :3306</text>
  <text x="1076" y="438" font-size="12" fill="#374151">readiness: mysqladmin ping over TCP 127.0.0.1</text>
  <text x="1076" y="456" font-size="12" fill="#374151">Secret: MYSQL_ROOT_PASSWORD, DB_USER, DB_PASS</text>
  <rect x="1060" y="480" width="360" height="74" rx="8" fill="#ffffff" stroke="#b45309"/>
  <text x="1076" y="504" font-size="14" font-weight="bold" fill="#111827">PVC mysql-data-mysql-0 · 5Gi · RWO</text>
  <text x="1076" y="526" font-size="12" fill="#374151">StorageClass managed-csi → Azure Disk</text>
  <text x="1076" y="544" font-size="12" fill="#374151">mounted at /var/lib/mysql</text>
  <text x="1060" y="590" font-size="12" fill="#374151">internal DNS: mysql.book-review.svc.cluster.local</text>
  <text x="1060" y="610" font-size="12" fill="#374151">no EXTERNAL-IP</text>

  <!-- Network policy box -->
  <rect x="60" y="650" width="1380" height="160" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="80" y="678" font-size="15" font-weight="bold" fill="#7f1d1d">NetworkPolicies (enforced by Cilium)</text>
  <text x="80" y="704" font-size="13" fill="#374151">backend-policy  (pods tier=backend): ingress only from tier=frontend on TCP 3001 · egress only to app=mysql on TCP 3306 and kube-dns on 53 UDP/TCP</text>
  <text x="80" y="728" font-size="13" fill="#374151">mysql-policy    (pods app=mysql): ingress only from tier=backend on TCP 3306</text>
  <text x="80" y="752" font-size="13" fill="#374151">frontend: no policy (must accept traffic from the load balancer)</text>
  <text x="80" y="786" font-size="13" fill="#b91c1c">Denied: any other Pod → backend:3001 ✕   any other Pod (including frontend) → mysql:3306 ✕   internet → backend / mysql ✕ (no public address)</text>

  <!-- Legend / flow -->
  <text x="40" y="870" font-size="15" font-weight="bold" fill="#111827">Request path</text>
  <text x="40" y="896" font-size="14" fill="#374151">Browser → Azure LB :80 → frontend-service → nginx :80 → (/) Next.js :3000  |  (/api) backend-service :3001 → backend Pod → mysql :3306 → Azure Disk</text>
  <text x="40" y="926" font-size="13" fill="#6b7280">Secret values are never in Git, images or screenshots: the Secret is created from a git-ignored env file (mode 600); only k8s/02-secret.example.yaml with placeholders is committed.</text>
</svg>
